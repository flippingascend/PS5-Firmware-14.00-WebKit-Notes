<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ASCEND overflow probe</title>
<style>
body{background:#0a0a0a;color:#00ff41;font:12px 'Courier New',monospace;padding:15px;margin:0}
pre{white-space:pre-wrap;word-break:break-all}
#stage{position:absolute;left:-4000px;top:0;width:120px;height:120px;overflow:hidden}
</style></head>
<body><pre id="log">Starting...</pre>
<div id="stage"></div>
<script>
'use strict';
var logEl=document.getElementById('log');
var lines=[];
function emit(cls,msg){
    lines.push('<span class="'+cls+'">'+String(msg).replace(/</g,'&lt;')+'</span>');
    logEl.innerHTML=lines.join('\n');logEl.scrollTop=logEl.scrollHeight;
    fetch('/result',{method:'POST',body:JSON.stringify({tag:cls,msg:String(msg).slice(0,450)}),headers:{'Content-Type':'application/json'}}).catch(function(){});
}
function info(m){emit('d','[info] '+m);}
function win(m){emit('y','[WIN] '+m);}
function sec(m){emit('c','\n=== '+m+' ===');}
function esc(s){
    var o='',i,c;
    s=String(s);
    for(i=0;i<s.length;i++){
        c=s.charCodeAt(i);
        if(c>=32&&c<127){o+=s.charAt(i);}
        else{o+='\\u'+('0000'+c.toString(16)).slice(-4);}
    }
    return o;
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
window.onerror=function(msg,src,line){emit('r','ERR:'+msg+'@'+line);};
if(typeof window.addEventListener==='function'){
    // A rejected promise that nobody awaits is invisible to window.onerror. Section N
    // streams proved it can happen, so it gets its own reported tag rather than
    // vanishing - a silent failure is worse than a loud one in a probe like this.
    window.addEventListener('unhandledrejection',function(e){
        var r=(e&&e.reason)||{};
        emit('r','UNHANDLED REJECTION: '+((r&&r.message)||String(r)));
    });
}
var P_NOW=(window.performance&&performance.now)?function(){return performance.now();}:function(){return Date.now();};
var HAS_DOM=(typeof document!=='undefined')&&(typeof document.createElement==='function');
fetch('/report',{method:'POST',body:JSON.stringify({id:'_start',ua:navigator.userAgent,text:'ov_probe'}),headers:{'Content-Type':'application/json'}}).catch(function(){});

// ========================================================================
// WHY THIS PROBE
//
// Six hardware runs closed out the JavaScriptCore regex family: 25 of Apple's
// own 102 regression cases still fail on fw 14.00, but every divergence is a
// wrong answer, a false positive or an ill-formed string. Not one produced a
// capture with start > end, a range outside the subject, a foreign code unit,
// or a read at m_input[length] - and section Z asked for exactly that read and
// got null every time. That route is measured and dead for a memory primitive.
//
// This probe attacks the classic route that needs no JIT at all: SIZE
// ARITHMETIC. Ask an API for a logical size whose element count overflows a
// 32-bit int, and if the implementation computes the allocation with that
// overflow it allocates a small buffer and then writes the full logical size
// into it. That is an out-of-bounds write reachable from a single call.
//
// Every case here is a SMALL object carrying an EXTREME parameter, because the
// overflow lives in the parameter arithmetic, not in a large allocation.
// Where a case has to ask for a genuinely huge buffer it is listed last, and
// the run posts progress around every case, so if the console dies the last
// TRY line names the culprit and the guide can simply be reloaded.
//
// THE ORACLE. There is no reference engine for C++, so the detector is the heap
// itself: a spray of ArrayBuffers filled with a known pattern is allocated and
// kept alive, and after every single case the whole spray is re-verified. A
// changed byte, or a byteLength that no longer matches, is HEAP CORRUPTION -
// the one signal that distinguishes a memory-safety bug from a wrong answer.
// A SELFTEST deliberately corrupts one sentinel to prove the detector fires.
//
// Progress protocol, so a crash is still informative:
//     TRY <id>   posted before the case runs
//     OK  <id>   posted after it returns and the sentinels verify
// A TRY with no matching OK is the case that killed the engine.
// ========================================================================

var SENT_N=24, SENT_LEN=2048;
var SENT=[];
function buildSentinels(){
    SENT=[];
    for(var i=0;i<SENT_N;i++){
        var ab=new ArrayBuffer(SENT_LEN);
        var u8=new Uint8Array(ab);
        for(var j=0;j<SENT_LEN;j++){ u8[j]=(i*31+j*7)&255; }
        SENT.push({ab:ab,u8:u8});
    }
}
function checkSentinels(){
    var bad=[],i,j,want;
    for(i=0;i<SENT.length;i++){
        if(SENT[i].ab.byteLength!==SENT_LEN){ bad.push('sentinel'+i+' byteLength='+SENT[i].ab.byteLength); continue; }
        for(j=0;j<SENT_LEN;j++){
            want=(i*31+j*7)&255;
            if(SENT[i].u8[j]!==want){ bad.push('sentinel'+i+' byte '+j+' is '+SENT[i].u8[j]+' want '+want); break; }
        }
    }
    return bad;
}
function pokeSentinel(){ SENT[0].u8[17]=123; }

var NB=0, NCORRUPT=0, NSLOW=0, NERR=0, TRYS=0, STATUS={};
function bomb(id, fn){
    TRYS++;
    emit('c','TRY '+id);
    var t0=P_NOW(), st='ok', det='';
    try{ det=String(fn()); }
    catch(e){ st='THREW:'+((e&&e.name)||'?'); NERR++; }
    var ms=P_NOW()-t0;
    if(ms>=1500){ st+=' SLOW'; NSLOW++; }
    releaseCvs();   // give the backing store back before anything else runs
    var bad=checkSentinels();
    if(bad.length){ st='HEAP-CORRUPT'; NCORRUPT++; emit('r','CORRUPTION after '+id+': '+bad.slice(0,3).join(' ~ ')); }
    NB++;
    STATUS[id]=st;
    emit('d','BOMB '+id+' status='+esc(st).slice(0,60)+' ms='+ms.toFixed(0)+' '+(det?esc(det).slice(0,150):''));
    if(bad.length===0) emit('d','OK '+id);
    return st;
}

// helpers that make the size arithmetic reachable
var big=[0x7FFFFFFF,0x40000000,0x20000000,0x10000,0x8000,0x4000,0xFFFFFFFE];
// Last canvas a case created, so every case can hand its backing store back the
// moment the case is over. Without this a 256 MiB canvas stays resident until the
// GC feels like it, and the user's repeated reloads of this page stack them up -
// which is exactly the pressure that was killing the browser.
var LASTCVS=null;
function cvs(w,h){
    var c=document.createElement('canvas');
    c.width=w; c.height=h;
    LASTCVS=c;
    return c;
}
function releaseCvs(){
    if(!LASTCVS) return;
    try{ LASTCVS.width=0; LASTCVS.height=0; }catch(e){}
    LASTCVS=null;
}
function ctxOf(w,h){
    var c=cvs(w,h);
    var x=c.getContext('2d');
    return x;
}
function svgFilter(inner){
    var ns='http://www.w3.org/2000/svg';
    var s=document.createElementNS(ns,'svg');
    s.setAttribute('width','40'); s.setAttribute('height','40');
    s.setAttribute('viewBox','0 0 40 40');
    var d=document.createElementNS(ns,'defs');
    var f=document.createElementNS(ns,'filter');
    f.setAttribute('id','ff');
    f.innerHTML=inner;
    d.appendChild(f); s.appendChild(d);
    var r=document.createElementNS(ns,'rect');
    r.setAttribute('x','0'); r.setAttribute('y','0'); r.setAttribute('width','40'); r.setAttribute('height','40');
    r.setAttribute('fill','#08f'); r.setAttribute('filter','url(#ff)');
    s.appendChild(r);
    document.getElementById('stage').appendChild(s);
    var b=s.getBoundingClientRect();
    var out=b.width+'x'+b.height;
    s.parentNode.removeChild(s);
    return out;
}

Promise.resolve().then(async function(){

// ---------------------------------------------------------------- SELFTEST
sec('SELFTEST: prove the sentinel oracle and the progress protocol fire');
buildSentinels();
info('sentinels allocated: '+SENT_N+' x '+SENT_LEN+' bytes = '+(SENT_N*SENT_LEN)+' bytes');
var clean=checkSentinels();
info('SELFTEST clean spray verifies: '+(clean.length===0?'YES':'NO '+clean.length)+'   REQUIRED: YES');
pokeSentinel();
var dirt=checkSentinels();
info('SELFTEST detector after a deliberate write: '+(dirt.length?'FIRED ('+dirt[0]+')':'SILENT')+'   REQUIRED: FIRED');
buildSentinels();
info('SELFTEST spray rebuilt, verifies: '+(checkSentinels().length===0?'YES':'NO')+'   REQUIRED: YES');
info('DOM available: '+HAS_DOM+'   (the dry run on a non-browser engine reports NO-DOM for every DOM case)');

// ---------------------------------------------------------------- A: canvas buffer arithmetic
sec('A: canvas buffer size arithmetic - logical area near and past 2^31');
bomb('A-01', function(){ var c=cvs(65536,65536); var x=c.getContext('2d'); x.fillStyle='#f00'; x.fillRect(0,0,65536,65536); var d=x.getImageData(0,0,1,1); return c.width+'x'+c.height+' px='+d.data[0]; });
bomb('A-02', function(){ var c=cvs(46341,46341); var x=c.getContext('2d'); x.fillRect(0,0,46341,46341); return x.getImageData(0,0,1,1).data[0]; });
bomb('A-03', function(){ var c=cvs(32768,65536); var x=c.getContext('2d'); x.fillRect(0,0,32768,65536); return x.getImageData(0,0,1,1).data[0]; });
bomb('A-04', function(){ var c=cvs(65536,32768); var x=c.getContext('2d'); x.fillRect(0,0,65536,32768); return x.getImageData(0,0,1,1).data[0]; });
bomb('A-05', function(){ var c=cvs(23170,23170); var x=c.getContext('2d'); x.fillRect(0,0,23170,23170); return x.getImageData(0,0,1,1).data[0]; });
bomb('A-06', function(){ var c=cvs(4096,4096); var x=c.getContext('2d'); x.fillRect(0,0,4096,4096); return x.getImageData(0,0,1,1).data[0]; });   // 64 MiB, down from 256 MiB: 256 MiB was measured as accepted back on 09:59 (ms=88), so the smaller control keeps the fact and lowers the peak the light run needs
bomb('A-07', function(){ var c=cvs(46340,46340); var x=c.getContext('2d'); x.fillRect(0,0,46340,46340); return x.getImageData(0,0,1,1).data[0]; });   // 46340*46340 = 2,147,395,600 px: the twin of A-02, this one just UNDER 2^31. The 16384x16384 (=1 GiB, the only case that really allocates big) moved to H-01 after the summary.
bomb('A-08', function(){ var c=cvs(1,0x7FFFFFFF); return c.width+'x'+c.height; });
bomb('A-09', function(){ var c=cvs(0x7FFFFFFF,1); return c.width+'x'+c.height; });
bomb('A-10', function(){ var c=cvs(0x7FFFFFFF,0x7FFFFFFF); return c.width+'x'+c.height; });
bomb('A-11', function(){ var c=cvs(0,0x7FFFFFFF); return c.width+'x'+c.height; });
bomb('A-12', function(){ var c=cvs(-1,4); return c.width+'x'+c.height; });
bomb('A-13', function(){ var c=cvs(NaN,4); return c.width+'x'+c.height; });
bomb('A-14', function(){ var c=cvs(1e21,4); return c.width+'x'+c.height; });
bomb('A-15', function(){ var c=cvs(0x100000000,2); return c.width+'x'+c.height; });
bomb('A-16', function(){ var c=cvs(0xFFFFFFFF,1); return c.width+'x'+c.height; });

// ---------------------------------------------------------------- B: ImageData arithmetic
sec('B: ImageData allocation and dirty-rect arithmetic');
bomb('B-01', function(){ var x=ctxOf(64,64); var d=x.createImageData(0x7FFFFFFF,1); return d.width+'x'+d.height+' len='+d.data.length; });
bomb('B-02', function(){ var x=ctxOf(64,64); var d=x.createImageData(1,0x7FFFFFFF); return d.width+'x'+d.height+' len='+d.data.length; });
bomb('B-03', function(){ var x=ctxOf(64,64); var d=x.createImageData(65536,65536); return d.width+'x'+d.height+' len='+d.data.length; });
bomb('B-04', function(){ var x=ctxOf(64,64); var d=x.createImageData(65536,16384); return d.width+'x'+d.height+' len='+d.data.length; });
bomb('B-05', function(){ var x=ctxOf(64,64); var d=x.createImageData(0x40000000,4); return d.data.length; });
bomb('B-06', function(){ var x=ctxOf(64,64); var d=x.createImageData(-1,1); return d.width+'x'+d.height; });
bomb('B-07', function(){ var x=ctxOf(64,64); var d=x.createImageData(NaN,1); return d.width+'x'+d.height; });
bomb('B-08', function(){ var x=ctxOf(64,64); var d=x.getImageData(0,0,0x7FFFFFFF,1); return d.data.length; });
bomb('B-09', function(){ var x=ctxOf(64,64); var d=x.getImageData(0,0,65536,65536); return d.data.length; });
bomb('B-10', function(){ var x=ctxOf(64,64); var d=x.getImageData(-0x7FFFFFFF,0,1,1); return d.data.length; });
bomb('B-11', function(){ var x=ctxOf(64,64); var d=x.getImageData(0,0,0,0); return d.data.length; });
bomb('B-12', function(){ var x=ctxOf(64,64); var d=x.createImageData(2,2); x.putImageData(d,-0x7FFFFFFF,-0x7FFFFFFF); return 'ok'; });
bomb('B-13', function(){ var x=ctxOf(64,64); var d=x.createImageData(2,2); x.putImageData(d,0x7FFFFFFF,0x7FFFFFFF); return 'ok'; });
bomb('B-14', function(){ var x=ctxOf(64,64); var d=x.createImageData(2,2); x.putImageData(d,3,3,0,0,0x7FFFFFFF,0x7FFFFFFF); return 'ok'; });
bomb('B-15', function(){ var x=ctxOf(64,64); var d=x.createImageData(2,2); x.putImageData(d,3,3,-0x7FFFFFFF,-0x7FFFFFFF,1,1); return 'ok'; });
bomb('B-16', function(){ var x=ctxOf(64,64); var d=x.getImageData(0,0,1,1); d.data.length; x.putImageData(d,0,0,0,0,65535,65535); return 'ok'; });

// ---------------------------------------------------------------- C: canvas geometry with extreme parameters
sec('C: canvas filters and geometry - small surface, extreme parameters');
bomb('C-01', function(){ var x=ctxOf(64,64); x.filter='blur(1e9px)'; x.fillStyle='#0f0'; x.fillRect(0,0,64,64); return x.getImageData(0,0,1,1).data[0]; });
bomb('C-02', function(){ var x=ctxOf(64,64); x.filter='blur(0.0001px)'; x.fillRect(0,0,64,64); return x.getImageData(0,0,1,1).data[0]; });
bomb('C-03', function(){ var x=ctxOf(64,64); x.filter='blur(1e38px)'; x.fillRect(0,0,64,64); return x.getImageData(0,0,1,1).data[0]; });
bomb('C-04', function(){ var x=ctxOf(64,64); x.filter='drop-shadow(1e9px 1e9px 1e9px red)'; x.fillRect(0,0,64,64); return x.getImageData(0,0,1,1).data[0]; });
bomb('C-05', function(){ var x=ctxOf(64,64); x.filter='blur(NaNpx)'; x.fillRect(0,0,64,64); return 'ok'; });
bomb('C-06', function(){ var x=ctxOf(64,64); var g=x.createLinearGradient(0,0,1e9,1e9); g.addColorStop(0,'#f00'); g.addColorStop(1,'#00f'); x.fillStyle=g; x.fillRect(0,0,64,64); return x.getImageData(0,0,1,1).data[0]; });
bomb('C-07', function(){ var x=ctxOf(64,64); var g=x.createRadialGradient(0,0,1e9,1e9,1e9,1e9); g.addColorStop(0,'#f00'); g.addColorStop(1,'#00f'); x.fillStyle=g; x.fillRect(0,0,64,64); return 'ok'; });
bomb('C-08', function(){ var x=ctxOf(64,64); var s=ctxOf(4,4); x.drawImage(s,0,0,1e9,1e9); return 'ok'; });
bomb('C-09', function(){ var x=ctxOf(64,64); var s=ctxOf(4,4); x.drawImage(s,0,0,-1e9,-1e9); return 'ok'; });
bomb('C-10', function(){ var x=ctxOf(64,64); var s=ctxOf(4,4); x.drawImage(s,-0x7FFFFFFF,-0x7FFFFFFF,0x7FFFFFFF,0x7FFFFFFF,0,0,64,64); return 'ok'; });
bomb('C-11', function(){ var x=ctxOf(64,64); x.setTransform(1e9,0,0,1e9,0,0); x.fillRect(0,0,64,64); return 'ok'; });
bomb('C-12', function(){ var x=ctxOf(64,64); x.font='1e9px sans-serif'; var m=x.measureText('Wg'); return 'w='+m.width; });
bomb('C-13', function(){ var x=ctxOf(64,64); x.shadowBlur=0x7FFFFFFF; x.shadowColor='#000'; x.fillRect(0,0,64,64); return 'ok'; });
bomb('C-14', function(){ var x=ctxOf(64,64); x.lineWidth=1e9; x.strokeRect(0,0,64,64); return 'ok'; });
bomb('C-15', function(){ var x=ctxOf(64,64); x.miterLimit=1e9; x.lineJoin='miter'; x.beginPath(); x.moveTo(0,0); x.lineTo(60,1); x.lineTo(0,60); x.stroke(); return 'ok'; });
bomb('C-16', function(){ var x=ctxOf(64,64); x.beginPath(); x.arc(32,32,1e9,0,6.28); x.fill(); return 'ok'; });
bomb('C-17', function(){ var x=ctxOf(64,64); x.beginPath(); x.arc(32,32,1e9,0,1e9); x.stroke(); return 'ok'; });
bomb('C-18', function(){ var x=ctxOf(64,64); x.beginPath(); x.roundRect(0,0,64,64,[1e9,1e9,1e9,1e9]); x.fill(); return 'ok'; });
bomb('C-19', function(){ var x=ctxOf(64,64); x.beginPath(); x.ellipse(32,32,1e9,1e9,0,0,6.28); x.fill(); return 'ok'; });
bomb('C-20', function(){ var x=ctxOf(64,64); x.scale(1e-9,1e-9); x.lineWidth=1e9; x.strokeRect(0,0,64,64); return 'ok'; });

// ---------------------------------------------------------------- D: SVG filters
sec('D: SVG filter primitives - small element, extreme parameters');
bomb('D-01', function(){ return svgFilter('<feGaussianBlur stdDeviation="1e9"/>'); });
bomb('D-02', function(){ return svgFilter('<feGaussianBlur stdDeviation="1e38"/>'); });
bomb('D-03', function(){ return svgFilter('<feGaussianBlur stdDeviation="1e9 1e9"/>'); });
bomb('D-04', function(){ return svgFilter('<feMorphology operator="dilate" radius="1e9"/>'); });
bomb('D-05', function(){ return svgFilter('<feMorphology operator="erode" radius="1e38"/>'); });
bomb('D-06', function(){ return svgFilter('<feConvolveMatrix order="1000 1000" kernelMatrix="1"/>'); });
bomb('D-07', function(){ return svgFilter('<feConvolveMatrix order="1e9 1e9" kernelMatrix="1"/>'); });
bomb('D-08', function(){ return svgFilter('<feConvolveMatrix order="3 3" kernelMatrix="1 1 1 1 1 1 1 1 1" divisor="0"/>'); });
bomb('D-09', function(){ return svgFilter('<feTurbulence baseFrequency="1e-38" numOctaves="8"/>'); });
bomb('D-10', function(){ return svgFilter('<feTurbulence type="fractalNoise" baseFrequency="1e9" numOctaves="8"/>'); });
bomb('D-11', function(){ return svgFilter('<feDisplacementMap in2="SourceGraphic" scale="1e9"/>'); });
bomb('D-12', function(){ return svgFilter('<feOffset dx="1e9" dy="1e9"/>'); });
bomb('D-13', function(){ return svgFilter('<feDropShadow dx="1e9" dy="1e9" stdDeviation="1e9"/>'); });
bomb('D-14', function(){ return svgFilter('<feTile/>'); });
bomb('D-15', function(){ return svgFilter('<feComponentTransfer><feFuncA type="table" tableValues="0 1 1 0"/></feComponentTransfer>'); });
bomb('D-16', function(){ return svgFilter('<feComposite operator="arithmetic" k1="1e9" k2="1e9" k3="1e9" k4="1e9"/>'); });
bomb('D-17', function(){ return svgFilter('<feImage href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2740%27 height=%2740%27%3E%3C/svg%3E"/>'); });
bomb('D-18', function(){ return svgFilter('<feColorMatrix type="matrix" values="1e9 0 0 0 0 0 1e9 0 0 0 0 0 1e9 0 0 0 0 0 1e9 0"/>'); });
bomb('D-19', function(){ return svgFilter('<feBlend in2="SourceGraphic" mode="multiply"/>'); });
bomb('D-20', function(){ return svgFilter('<feGaussianBlur stdDeviation="-1e9"/>'); });

// ---------------------------------------------------------------- E: bitmap resize and crop arithmetic
sec('E: createImageBitmap resize and crop arithmetic');
var PNG1x1='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==';
function blobOf(url){
    return fetch(url).then(function(r){ return r.blob(); });
}
async function bmp(opts, what){
    var b=await blobOf(PNG1x1);
    var bm=await createImageBitmap(b,opts);
    var out=bm.width+'x'+bm.height;
    var x=ctxOf(64,64);
    x.drawImage(bm,0,0);
    if(bm.close) bm.close();
    return out+(what?' '+what:'');
}
// the bitmap cases need await, so they run in the async group below
async function asyncGroup(){
    var cases=[
        ['E-01 resize to a huge square', {resizeWidth:1e9,resizeHeight:1e9}],
        ['E-02 resize width only, 32-bit max', {resizeWidth:0x7FFFFFFF,resizeHeight:1}],
        ['E-03 resize both to 32-bit max', {resizeWidth:0x7FFFFFFF,resizeHeight:0x7FFFFFFF}],
        ['E-04 crop rect with a huge extent', {cropRect:{x:0,y:0,width:1e9,height:1e9}}],
        ['E-05 crop rect at a huge negative origin', {cropRect:{x:-1e9,y:-1e9,width:1e9,height:1e9}}],
        ['E-06 crop width 32-bit max', {cropRect:{x:0,y:0,width:0x7FFFFFFF,height:1}}],
        ['E-07 resize plus crop together', {cropRect:{x:0,y:0,width:1e9,height:1e9},resizeWidth:1e9,resizeHeight:1e9}],
        ['E-08 resize to NaN', {resizeWidth:NaN,resizeHeight:1}],
        ['E-09 resize to zero', {resizeWidth:0,resizeHeight:0}],
        ['E-10 resizeQuality high with a huge box', {resizeWidth:1e9,resizeHeight:1e9,resizeQuality:'high'}],
        ['E-11 imageOrientation flipY control', {imageOrientation:'flipY'}],
        ['E-12 crop of zero size', {cropRect:{x:0,y:0,width:0,height:0}}]
    ];
    for(var i=0;i<cases.length;i++){
        var label=cases[i][0], id=label.split(' ')[0], opts=cases[i][1];   // per-case id: every E case used to post as just 'E-'
        emit('c','TRY '+id);
        TRYS++;
        var t0=P_NOW(), st='ok', det='';
        try{ det=await bmp(opts); }catch(e){ st='THREW:'+((e&&e.name)||'?'); NERR++; }
        var ms=P_NOW()-t0;
        if(ms>=1500){ st+=' SLOW'; NSLOW++; }
        releaseCvs();
        var bad=checkSentinels();
        if(bad.length){ st='HEAP-CORRUPT'; NCORRUPT++; emit('r','CORRUPTION after '+id+': '+bad.slice(0,3).join(' ~ ')); }
        NB++; STATUS[id]=st;
        emit('d','BOMB '+label+' status='+esc(st).slice(0,50)+' ms='+ms.toFixed(0)+' '+(det?esc(det).slice(0,120):''));
        if(bad.length===0) emit('d','OK '+id);
        await sleep(10);
    }
}
if(HAS_DOM){ await asyncGroup(); } else { info('dry run without a DOM: the 12 E cases are not attempted here'); }

// ---------------------------------------------------------------- F: new formatting code
sec('F: the newest formatting and text code - least audited arithmetic');
bomb('F-01', function(){ if(typeof Intl==='undefined'||!Intl.DurationFormat) return 'no Intl.DurationFormat'; var f=new Intl.DurationFormat('en',{style:'long'}); return f.format({seconds:1e21}); });

// ---------------------------------------------------------------- v2 fix: why the summary moved up
// RUN 4 OF v1 died with the console reporting "there is not enough free system
// memory". The log names the case: TRY A-07 with no OK, and A-07 was
// cvs(16384,16384) = 16384*16384*4 = 1,073,741,824 bytes = exactly 1 GiB. In
// runs 1-3 that same case came back "ok SLOW ms=3355/4622/4805", so the engine
// really does back a 1 GiB canvas; those canvases were still resident when run 4
// asked for another one, and the WebContent process hit the console's ceiling.
// The 1 GiB canvas is therefore a POSITIVE CONTROL for the hypothesis - a case
// that gets a genuine large backing store is the only way to see an allocation
// sized from an overflowed count - but it has to be the LAST thing we ask for,
// after every result is already on the wire. Hence: light sections, then the
// summary, then the heavy group, and every heavy case releases its backing store
// and yields before the next one.

// ---------------------------------------------------------------- J: boundary arithmetic that CANNOT allocate

// is not enough free system memory". So on this engine a 2 GiB ArrayBuffer

// The census says the font parser, the image decoders and the compression code are

function b32(v){ return [(v>>>24)&0xff,(v>>>16)&0xff,(v>>>8)&0xff,v&0xff]; }

// LOADED could be rendering with a font an EARLIER case had already registered, and the
// pixel readback would then be measuring the wrong font. Separate names cost nothing.
async function tryFontSrc(fam, src){
    var r='no FontFace';
    if(typeof FontFace!=='undefined'){
        try{
            var ff=new FontFace(fam, 'url('+src+')');
            r=await Promise.race([
                ff.load().then(function(){ return 'LOADED'; }, function(e){ return 'rejected:'+((e&&e.name)||'?'); }),
                sleep(1500).then(function(){ return 'timeout-1.5s'; })
            ]);
            if(r==='LOADED'){
                try{ document.fonts.add(ff); }catch(e){}
                var x=ctxOf(64,64); x.font='32px '+fam;
                var m=x.measureText('Ag');
                x.fillText('Ag',2,40);
                // Count the INK over the whole canvas, not one byte in a corner. The first
                // version read getImageData(0,0,8,8).data[0] - the top-left corner, while
                // the glyph is drawn at x=2 with its baseline at y=40, so that byte is 0
                // by construction. Both controls reported px=0 on 2026-10-08 11:22, which
                // is what exposed it: a readback that cannot distinguish a drawn glyph
                // from an empty canvas proves nothing about the glyph path.
                var d=x.getImageData(0,0,64,64).data, ink=0;
                for(var q=3;q<d.length;q+=4) if(d[q]) ink++;

    var CTRL1='', CTRL2='';
    var cases=[
        ['N-C1 CONTROL real font over the wire - MUST say LOADED', function(){ if(!CAL) return 'no calibration font (the fetch failed)'; return tryFontSrc('nf_c1', '_cal.ttf'); }],
        ['N-C2 CONTROL same real font through a data: URL - MUST say LOADED', function(){ if(!CAL) return 'no calibration font (the fetch failed)'; return tryFont('c2', CAL); }],
        ['N-01 WOFF2 header, numTables 0xFFFF', function(){ return tryFont('n1', cat(ascii('wOF2'), b32(0x00010000), b32(48), b16(0xFFFF), b16(0), b32(0xFFFFFFFF), b32(0xFFFFFFFF), b32(0xFFFFFFFF), b32(0xFFFFFFFF), b32(0), b32(0), b32(0)), 'font/woff2'); }],
        ['N-02 SFNT with bogus numTables', function(){ return tryFont('n2', sfnt([{tag:'head',data:new Uint8Array(54)}], 0xFFFF)); }],
        ['N-03 glyf offset beyond the file', function(){ var g=new Uint8Array(16); g[0]=0xFF; return tryFont('n3', sfnt([{tag:'glyf',data:g},{tag:'loca',data:new Uint8Array(8)}])); }],
        ['N-04 cmap format 4, segCountX2 0xFFFF', function(){ return tryFont('n4', sfnt([{tag:'cmap',data:cat(b16(0),b16(1),b16(4),b16(0),b32(12),b16(4),b16(0xFFFF),b16(0),b16(0),b16(0),b16(0),b16(0))}])); }],
        ['N-05 SVG-in-OT with extreme viewBox', function(){ var s=ascii('<svg xmlns="http://www.w3.org/2000/svg"><g id="g1"><path d="M0 0L1e9 1e9z"/></g></svg>'); return tryFont('n5', sfnt([{tag:'SVG ',data:s}])); }],
        ['N-06 PNG IHDR 0x7FFFFFFF square, no IDAT', function(){ return tryImage('n6', cat([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A], pngChunk('IHDR', cat(b32(0x7FFFFFFF), b32(0x7FFFFFFF), [8,6,0,0,0])))); }],
        ['N-07 PNG chunk length 0x7FFFFFFF', function(){ return tryImage('n7', cat([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A], b32(0x7FFFFFFF), ascii('IDAT'), [0,0,0,0])); }],
        ['N-08 GIF screen descriptor 0xFFFF', function(){ return tryImage('n8', cat(ascii('GIF89a'), b16(0xFFFF), b16(0xFFFF), [0xF7,0,0], ascii(';')), 'image/gif'); }],
        ['N-09 WebP VP8X canvas 0xFFFFFF', function(){ return tryImage('n9', cat(ascii('RIFF'), b32(0x7FFFFFFF), ascii('WEBP'), ascii('VP8X'), b32(10), [0,0,0,0,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF]), 'image/webp'); }],
        ['N-10 AVIF ftyp with a huge box size', function(){ return tryImage('n10', cat(b32(0xFFFFFFFF), ascii('ftyp'), ascii('avif'), b32(0), ascii('avif'), ascii('mif1')), 'image/avif'); }]
    ];   // 12 entries: the two N-C controls first, then the 10 payloads N-01..N-10. N-10 was
          // listed twice until 11:12 on 2026-10-08; a duplicate id means a duplicate BOMB line
          // and an off-by-one case count, so it was removed.
    for(var i=0;i<cases.length;i++){
        var label=cases[i][0], fn=cases[i][1], id=label.split(' ')[0];
        emit('c','TRY '+id); TRYS++;
        var t0=P_NOW(), st='ok', det='';
        try{ det=await fn(); }catch(e){ st='THREW:'+((e&&e.name)||'?'); NERR++; }
        var ms=P_NOW()-t0;
        if(ms>=1500){ st+=' SLOW'; NSLOW++; }
        if(id==='N-C1') CTRL1=det; if(id==='N-C2') CTRL2=det;
        releaseCvs();
        var bad=checkSentinels();
        if(bad.length){ st='HEAP-CORRUPT'; NCORRUPT++; emit('r','CORRUPTION after '+id+': '+bad.slice(0,3).join(' ~ ')); }
        NB++; STATUS[id]=st;
        emit('d','BOMB '+label+' status='+esc(st).slice(0,40)+' ms='+ms.toFixed(0)+' '+esc(det).slice(0,120));
        if(bad.length===0) emit('d','OK '+id);
        await sleep(20);
    }
    var okc1=/^LOADED/.test(String(CTRL1)), okc2=/^LOADED/.test(String(CTRL2));
    if(okc1 && okc2){
        info('FONT INSTRUMENT VALID this load: both controls loaded the real font, one over the wire and one through a data: URL. So a font case above reporting rejected:NetworkError was refused BY THE PARSER - the bytes reached it. The font half of section N counts.');
    } else {
        win('FONT INSTRUMENT INVALID this load: the controls answered ['+esc(CTRL1)+'] and ['+esc(CTRL2)+'] where both must say LOADED. The font payload cases above prove NOTHING on this load - only the image (N-06..N-10) and compression (N-11, N-12) halves of section N count.');
    }
}
// Compression needs no DOM, so its two payloads run even in the dry run - which is
// how they get a reference-engine value instead of only a hardware one.
async function compressionGroup(){
    var cases=[
        ['N-11 deflate stream of 0xFF bytes', function(){ var a=new Uint8Array(64); for(var i=0;i<64;i++) a[i]=0xFF; return tryDecompress('deflate', a); }],
        ['N-12 gzip header then garbage', function(){ var a=new Uint8Array(32); a[0]=0x1F; a[1]=0x8B; a[2]=8; for(var i=4;i<32;i++) a[i]=0xEE; return tryDecompress('gzip', a); }]
    ];
    for(var i=0;i<cases.length;i++){
        var label=cases[i][0], fn=cases[i][1], id=label.split(' ')[0];
        emit('c','TRY '+id); TRYS++;
        var t0=P_NOW(), st='ok', det='';
        try{ det=await fn(); }catch(e){ st='THREW:'+((e&&e.name)||'?'); NERR++; }
        var ms=P_NOW()-t0;
        var bad=checkSentinels();
        if(bad.length){ st='HEAP-CORRUPT'; NCORRUPT++; emit('r','CORRUPTION after '+id+': '+bad.slice(0,3).join(' ~ ')); }
        NB++; STATUS[id]=st;
        emit('d','BOMB '+label+' status='+esc(st).slice(0,40)+' ms='+ms.toFixed(0)+' '+esc(det).slice(0,120));
        if(bad.length===0) emit('d','OK '+id);
        await sleep(20);
    }
}
if(!HAS_DOM){ info('dry run without a DOM: the 10 N font and image payloads are not attempted here (they need FontFace and createImageBitmap)'); }
else { await payloadGroup(); }
if(typeof DecompressionStream!=='undefined'){ await compressionGroup(); }
else { info('no DecompressionStream here: the 2 compression payload cases are skipped'); }

// ---------------------------------------------------------------- main summary (posted BEFORE any heavy ask)
sec('MAIN SUMMARY - every light case (SELFTEST, A, B, C, D, E, F) has now run');
win('SUMMARY: '+NB+' cases, '+NCORRUPT+' heap-corruption, '+NERR+' threw, '+NSLOW+' slow');
if(NCORRUPT){ win('CORRUPTION CASES: '+Object.keys(STATUS).filter(function(k){return STATUS[k].indexOf('CORRUPT')>=0;}).join(' ')); }
info('Reading: HEAP-CORRUPT means a sentinel ArrayBuffer changed while a case ran - an out-of-bounds write somewhere.');
info('Reading: a TRY line with no matching OK line is the case that killed the engine; reload the guide and read the last TRY.');
info('Reading: THREW is the safe outcome (the implementation rejected the request). SLOW means a case took over 1.5 s.');
info('Sentinel spray: '+(SENT_N*SENT_LEN)+' bytes across '+SENT_N+' buffers, re-verified after every case.');
info('DOM available: '+HAS_DOM+'. A NO-DOM run only exercises the non-DOM cases.');
info('Everything above is safely recorded. The heavy allocation group H starts next and may exhaust the console renderer - that is the point of it.');
emit('g','ov_probe LIGHT SECTIONS COMPLETE - heavy group '+(HEAVY_OK?'ENABLED (?heavy=1) and starting now':'SKIPPED on this load (no ?heavy=1)'));

// ---------------------------------------------------------------- H: the heavy tail, now OPT-IN
// 2026-10-08, run of v2 on hardware: the log shows TWELVE page loads in the v2
// window, three of them running at 10:06:32/39/43, and every one of them posted
// TRY H-01 with no OK H-01. The 1 GiB canvas kills the renderer, the console
// replaces the page with "there is not enough free system memory", and then the
// browser reloads the page and tries again - so the page could never finish its
// heavy group, and concurrent loads stacked more 1 GiB requests on top of each
// other. Meanwhile NO G CASE HAS EVER RUN ON HARDWARE (grep 'BOMB G-' across the
// whole log: zero), which means the byte-count boundary tests - the actual
// hypothesis - have never been attempted. Fix: the heavy group is now opt-in via
// ?heavy=1, so a plain load can never crash, and the order inside it puts the
// byte-count cases first and the canvas controls last.
sec('H: HEAVY TAIL - gated: it runs ONLY when the page is loaded with ?heavy=1');
var Q=(typeof location!=='undefined')?String(location.search):'';
var HEAVY_OK=/[?&]heavy=1/.test(Q);
var CANVAS_OK=/[?&]canvas=1/.test(Q);
var AGAIN= /[?&]again=1/.test(Q);
var MARK='ov_probe_heavy_attempted';
function lsGet(k){ try{ return window.localStorage?window.localStorage.getItem(k):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(window.localStorage) window.localStorage.setItem(k,v); }catch(e){} }
var ATTEMPTED=lsGet(MARK);
if(HEAVY_OK && ATTEMPTED && !AGAIN){
    HEAVY_OK=false;
    info('HEAVY TAIL NOT RUN AGAIN: this browser already attempted it once. That is deliberate. The console shows "there is not enough free system memory", the browser reloads the SAME URL, and without this marker it would ask for 1-4 GiB again and die again, forever - which is exactly the loop that was observed. The light results above are unaffected. To try once more, follow the link at the end of this run: it carries &again=1.');
}
if(!HEAVY_OK){
    info('HEAVY TAIL SKIPPED on this load. Those cases ask for 1-4 GiB; the canvas controls among them have killed this browser before. Everything above is complete either way.');
} else {
    lsSet(MARK,String(Date.now()));   // set BEFORE the cases run, so a crash part way through still counts as attempted
    info('HEAVY TAIL ENABLED by ?heavy=1. Canvas stage is '+(CANVAS_OK?'ALSO enabled (&canvas=1)':'NOT enabled - it needs a separate &canvas=1')+'. Order is by hypothesis value: the 2^31 and 2^32 byte-count cases first, the canvas controls LAST.');
}
async function heavy(id, bytes, what, fn){
    emit('c','TRY '+id);
    TRYS++;
    emit('c','MEMREQ '+id+' asks for '+(bytes/1048576).toFixed(1)+' MiB ('+bytes+' bytes) - '+what);
    var t0=P_NOW(), st='ok', det='';
    try{ det=String(fn()); }
    catch(e){ st='THREW:'+((e&&e.name)||'?'); NERR++; }
    var ms=P_NOW()-t0;
    if(ms>=1500){ st+=' SLOW'; NSLOW++; }
    var bad=checkSentinels();
    if(bad.length){ st='HEAP-CORRUPT'; NCORRUPT++; emit('r','CORRUPTION after '+id+': '+bad.slice(0,3).join(' ~ ')); }
    NB++; STATUS[id]=st;
    emit('d','BOMB '+id+' status='+esc(st).slice(0,60)+' ms='+ms.toFixed(0)+' '+(det?esc(det).slice(0,150):''));
    if(bad.length===0) emit('d','OK '+id);
    return st;
}
function heavyCanvas(id,w,h){
    return heavy(id, w*h*4, 'canvas '+w+'x'+h, function(){
        var c=cvs(w,h), x=c.getContext('2d');
        x.fillStyle='#f00'; x.fillRect(0,0,w,h);
        var out=c.width+'x'+c.height+' px='+x.getImageData(0,0,1,1).data[0];
        try{ c.width=0; c.height=0; }catch(e){}   // release the backing store at once: stacking two 1 GiB canvases is what killed run 4
        return out;
    });
}
// The fatal cases are GONE, and the measurement is why. TRY G-02 was posted at
// 10:16:00, 10:24:24 and 10:24:29, and NOT ONE of the three ever produced a
// MEMREQ, a BOMB or an OK - while the light run in the same session completed
// three times. G-02 was new ArrayBuffer(0x7FFFFFFF), 2 GiB. Three attempts,
// three instant deaths: this engine COMMITS what you ask it for, so a request
// past the ceiling does not return an error, it takes the browser with it. The
// same load, 10:23:05, proves the storage marker cannot save us either - it said
// ENABLED on a load where the marker had already been written, so localStorage is
// not persisting in the console browser. Protection therefore has to be
// structural: no case in this group may ask for more than the browser can give.
// The 2^31 / 2^32 boundary question is answered in full by section J, which asks
// it through APIs that clamp or throw and needs no memory at all.
// What is left is a RAMP: 64 / 128 / 256 / 512 MiB, each released before the next,
// which measures how much the browser will actually hand out without ever asking
// for a size already known to be fatal.
var HEAVY=[
    ['G-11', function(){ return new ArrayBuffer(0x04000000).byteLength; }, 0x04000000, 'ArrayBuffer 64 MiB - ramp step 1'],
    ['G-12', function(){ return new ArrayBuffer(0x08000000).byteLength; }, 0x08000000, 'ArrayBuffer 128 MiB - ramp step 2'],
    ['G-13', function(){ return new ArrayBuffer(0x10000000).byteLength; }, 0x10000000, 'ArrayBuffer 256 MiB - ramp step 3'],
    ['G-14', function(){ return new ArrayBuffer(0x20000000).byteLength; }, 0x20000000, 'ArrayBuffer 512 MiB - ramp step 4'],
    ['G-15', function(){ var u=new Uint8Array(0x20000000); return u.length; }, 0x20000000, 'Uint8Array 512 MiB - the allocating view form, one step below the fatal 2 GiB'],
    ['G-16', function(){ return 'x'.repeat(0x04000000).length; }, 0x04000000, 'string, 64 MiB of units'],
    ['G-07', function(){ var a=new Uint8Array(16); var b=a.subarray(8,1); return b.length; }, 16, 'control: inverted subarray range'],
    ['G-08', function(){ var a=new Uint8Array(16); return a.slice(-1e9,1e9).length; }, 16, 'control: slice with extreme negative indices'],
    ['G-06', function(){ var s='ab'.repeat(1e6); return s.length+s.indexOf('ba'); }, 2000000, 'control: 2M-unit string search']
];
if(!HEAVY_OK){
    info('heavy group not attempted on this load. Section J above already tested the same 2^31 and 2^32 boundaries through clamping APIs, with no allocation.');
} else {
    for(var hh=0; hh<HEAVY.length; hh++){
        await heavy(HEAVY[hh][0], HEAVY[hh][2], HEAVY[hh][3], HEAVY[hh][1]);
        await sleep(500);
    }
    if(HAS_DOM && CANVAS_OK){
        await heavyCanvas('H-03',8192,8192); await sleep(500);   // 256 MiB canvas - measured on hardware: ok, ms=39, pixel readback 255, so it really is allocated AND drawn
    } else if(HAS_DOM){
        info('the canvas stage did NOT run on this load. H-01 (a 1 GiB canvas) is DELETED from this page for the same reason G-02 and G-03 were: it was measured killing this renderer six times, and nothing is left to learn from it. Add &canvas=1 to run the 256 MiB canvas, which is known to be safe.');
    } else { info('canvas stage skipped: no DOM, so no canvas'); }
}

// ---------------------------------------------------------------- final summary
sec('FINAL SUMMARY - light sections plus the heavy tail');
win('SUMMARY: '+NB+' cases, '+NCORRUPT+' heap-corruption, '+NERR+' threw, '+NSLOW+' slow');
if(NCORRUPT){ win('CORRUPTION CASES: '+Object.keys(STATUS).filter(function(k){return STATUS[k].indexOf('CORRUPT')>=0;}).join(' ')); }
emit('g','ov_probe DONE');
if(HAS_DOM && document.body && document.createElement){
    // one click, no URL typing: the console browser can follow a same-page link
    var lh=null, lt=null;
    if(!HEAVY_OK){
        lh='?heavy=1'+(ATTEMPTED?'&again=1':'');
        lt='>>> CLICK TO RUN THE HEAVY GROUP: the 2^31 and 2^32 byte-count cases (1 to 4 GiB requests, no canvas) <<<';
    } else if(!CANVAS_OK){
        lh='?heavy=1&canvas=1&again=1';
        lt='>>> OPTIONAL CANVAS STAGE, last and now safe: one 256 MiB canvas. The two 1 GiB canvases are DELETED from this page <<<';
    }
    if(lh){
        var ha=document.createElement('a');
        ha.href=lh;
        ha.textContent=lt;
        ha.style.cssText='display:block;margin:14px 0;padding:10px;border:2px solid #0f0;color:#0ff;font-size:15px;text-decoration:none';
        document.body.appendChild(ha);
        emit('g','heavy-group link added: '+lh);
    }
}
fetch('/report',{method:'POST',body:JSON.stringify({id:'_done',text:'ov_probe complete'}),headers:{'Content-Type':'application/json'}}).catch(function(){});

}).catch(function(e){
    emit('r','MAIN ERR: '+e.message);
    fetch('/result',{method:'POST',body:JSON.stringify({tag:'r',msg:'MAIN ERR:'+e.message}),headers:{'Content-Type':'application/json'}}).catch(function(){});
});
</script></body></html>
